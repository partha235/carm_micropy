<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Robotic Vehicle Control</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: #111827;
            color: #e5e7eb;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;
        }

        /* =========================
           MAIN CONTROL PANEL
           ========================= */

        .control-panel {
            width: 100%;
            max-width: 520px;

            background: #1f2937;

            border: 1px solid #374151;

            border-radius: 16px;

            padding: 30px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }

        /* =========================
           HEADER
           ========================= */

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 600;
            color: #f9fafb;

            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #9ca3af;
        }

        /* =========================
           STATUS
           ========================= */

        .status {
            display: flex;
            justify-content: center;
            align-items: center;

            gap: 8px;

            margin-bottom: 25px;

            font-size: 14px;
            color: #d1d5db;
        }

        .status-dot {
            width: 10px;
            height: 10px;

            background: #22c55e;

            border-radius: 50%;

            box-shadow:
                0 0 10px rgba(34, 197, 94, 0.7);
        }

        /* =========================
           CONTROL AREA
           ========================= */

        .controls {
            display: flex;
            flex-direction: column;

            align-items: center;

            gap: 12px;
        }

        .control-row {
            display: flex;
            justify-content: center;

            gap: 12px;
        }

        /* =========================
           CONTROL BUTTON
           ========================= */

        .control-button {

            width: 90px;
            height: 70px;

            border: 1px solid #4b5563;

            border-radius: 12px;

            background: #374151;

            color: #f9fafb;

            font-size: 30px;

            cursor: pointer;

            transition:
                background 0.15s,
                transform 0.1s,
                border-color 0.15s;

            user-select: none;

            -webkit-user-select: none;

            touch-action: manipulation;
        }

        .control-button:hover {

            background: #4b5563;

            border-color: #6b7280;
        }

        .control-button:active {

            transform: scale(0.94);

            background: #2563eb;

            border-color: #60a5fa;
        }

        /* =========================
           STOP BUTTON
           ========================= */

        .stop-button {

            width: 194px;
            height: 60px;

            margin-top: 10px;

            border: none;

            border-radius: 12px;

            background: #dc2626;

            color: white;

            font-size: 17px;

            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.15s,
                transform 0.1s;
        }

        .stop-button:hover {

            background: #ef4444;
        }

        .stop-button:active {

            transform: scale(0.96);

            background: #b91c1c;
        }

        /* =========================
           LABELS
           ========================= */

        .button-label {

            display: block;

            font-size: 11px;

            color: #9ca3af;

            margin-top: 5px;

            text-transform: uppercase;

            letter-spacing: 0.8px;
        }

        /* =========================
           FOOTER
           ========================= */

        .footer {

            text-align: center;

            margin-top: 25px;

            padding-top: 18px;

            border-top: 1px solid #374151;

            font-size: 12px;

            color: #6b7280;
        }

        /* =========================
           MOBILE
           ========================= */

        @media (max-width: 480px) {

            .control-panel {

                padding: 22px;

            }

            .control-button {

                width: 78px;
                height: 65px;

                font-size: 26px;

            }

            .stop-button {

                width: 168px;

            }

        }

    </style>

    <script>

        /*
         * ==============================
         * SEND COMMAND TO ROBOT
         * ==============================
         */

        function sendRequest(command) {

            var xhr = new XMLHttpRequest();

            xhr.open(
                "GET",
                "/?action=" + encodeURIComponent(command),
                true
            );

            xhr.send();

        }


        /*
         * ==============================
         * START MOVEMENT
         * ==============================
         */

        function startMovement(command) {

            sendRequest(command);

        }


        /*
         * ==============================
         * STOP MOVEMENT
         * ==============================
         */

        function stopMovement() {

            sendRequest("stop");

        }


        /*
         * ==============================
         * PREVENT CONTEXT MENU
         * ==============================
         */

        document.addEventListener(
            "contextmenu",
            function(event) {

                event.preventDefault();

            }
        );

    </script>

</head>


<body>

    <main class="control-panel">


        <!-- =========================
             HEADER
             ========================= -->

        <header class="header">

            <h1>
                Robotic Vehicle Control
            </h1>

            <p>
                Remote Navigation Interface
            </p>

        </header>


        <!-- =========================
             STATUS
             ========================= -->

        <div class="status">

            <span class="status-dot"></span>

            <span>
                System Ready
            </span>

        </div>


        <!-- =========================
             CONTROL BUTTONS
             ========================= -->

        <section class="controls">


            <!-- FORWARD -->

            <div class="control-row">

                <div>

                    <button
                        class="control-button"
                        aria-label="Move Forward"

                        onmousedown="
                            startMovement('forward')
                        "

                        onmouseup="
                            stopMovement()
                        "

                        ontouchstart="
                            startMovement('forward')
                        "

                        ontouchend="
                            stopMovement()
                        "

                        onmouseleave="
                            stopMovement()
                        "
                    >
                        ▲
                    </button>

                    <span class="button-label">
                        Forward
                    </span>

                </div>

            </div>


            <!-- LEFT / RIGHT -->

            <div class="control-row">


                <div>

                    <button
                        class="control-button"
                        aria-label="Turn Left"

                        onmousedown="
                            startMovement('left')
                        "

                        onmouseup="
                            stopMovement()
                        "

                        ontouchstart="
                            startMovement('left')
                        "

                        ontouchend="
                            stopMovement()
                        "

                        onmouseleave="
                            stopMovement()
                        "
                    >
                        ◀
                    </button>

                    <span class="button-label">
                        Left
                    </span>

                </div>


                <div>

                    <button
                        class="control-button"
                        aria-label="Turn Right"

                        onmousedown="
                            startMovement('right')
                        "

                        onmouseup="
                            stopMovement()
                        "

                        ontouchstart="
                            startMovement('right')
                        "

                        ontouchend="
                            stopMovement()
                        "

                        onmouseleave="
                            stopMovement()
                        "
                    >
                        ▶
                    </button>

                    <span class="button-label">
                        Right
                    </span>

                </div>


            </div>


            <!-- BACKWARD -->

            <div class="control-row">

                <div>

                    <button
                        class="control-button"
                        aria-label="Move Backward"

                        onmousedown="
                            startMovement('backward')
                        "

                        onmouseup="
                            stopMovement()
                        "

                        ontouchstart="
                            startMovement('backward')
                        "

                        ontouchend="
                            stopMovement()
                        "

                        onmouseleave="
                            stopMovement()
                        "
                    >
                        ▼
                    </button>

                    <span class="button-label">
                        Reverse
                    </span>

                </div>

            </div>


            <!-- EMERGENCY STOP -->

            <button
                class="stop-button"
                onclick="
                    stopMovement()
                "
            >
                ■ &nbsp; STOP
            </button>


        </section>


        <!-- =========================
             FOOTER
             ========================= -->

        <footer class="footer">

            Robotic Vehicle Navigation System

        </footer>


    </main>

</body>

</html>
